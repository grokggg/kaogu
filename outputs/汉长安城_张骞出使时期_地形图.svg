<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1060" width="1100" height="1060">
<defs>
  <style>
    text { font-family: "Noto Sans CJK SC", "WenQuanYi Micro Hei", "Microsoft YaHei", sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #5c3d1e; }
    .subtitle { font-size: 13px; fill: #8b6f47; }
    .palace-name { font-size: 17px; font-weight: 700; fill: #5c3d1e; }
    .palace-sub { font-size: 10px; fill: #6b5030; }
    .gate-name { font-size: 11px; font-weight: 600; fill: #3a2510; }
    .main-gate { font-size: 12px; font-weight: 700; fill: #8b0000; }
    .bldg-name { font-size: 9px; fill: #5c3d1e; }
    .water-text { font-size: 11px; fill: #2a5566; }
    .note-text { font-size: 10px; fill: #5c4a2a; }
    .not-built { font-size: 10px; fill: #888; font-style: italic; }
    .route-text { font-size: 11px; fill: #c00000; font-weight: 700; }
    .legend-text { font-size: 11px; fill: #4a3820; }
  </style>
</defs>

<!-- 背景 -->
<rect x="0" y="0" width="1100" height="1050" fill="#faf6ea"/>

<!-- 标题 -->
<text x="550" y="40" text-anchor="middle" class="title">汉长安城复原平面图</text>
<text x="550" y="62" text-anchor="middle" class="subtitle">张骞出使西域时期（前139-前126年） · 依据考古实测数据绘制</text>

<!-- 绘图区域起始 y=80 -->

<!-- 渭河（城北） -->
<path d="M 0,190 Q 100,170 200,180 Q 350,195 500,175 Q 650,155 800,165 Q 950,175 1100,155 L 1100,110 Q 900,125 700,135 Q 500,145 300,140 Q 150,135 0,150 Z" fill="#a8c8d8" opacity="0.6"/>
<text x="900" y="145" class="water-text" font-weight="600">渭 河</text>

<!-- 泬水（城西） -->
<path d="M 120,900 Q 100,700 110,550 Q 115,400 140,280 Q 160,200 180,180 L 200,180 Q 170,280 160,400 Q 150,540 145,680 Q 140,830 160,900 Z" fill="#a8c8d8" opacity="0.5"/>
<text x="125" y="500" class="water-text" transform="rotate(-85,125,500)">泬水（潏水）</text>

<!-- 龙首原高地 -->
<path d="M 180,480 Q 300,440 450,420 Q 600,410 750,430 Q 850,450 920,500 L 920,540 Q 750,480 600,470 Q 450,465 300,490 Q 200,510 180,530 Z" fill="#e0d0a8" opacity="0.4"/>
