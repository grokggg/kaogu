<!-- 城墙主体（夯土） -->
<path d="M 180,220 L 180,750 Q 200,780 240,795 L 490,865 Q 530,875 570,860 L 710,815 Q 760,785 810,795 L 920,825 Q 940,830 945,815 L 945,280 Q 940,260 925,255 L 770,250 Q 710,245 670,230 L 490,215 Q 410,210 340,220 L 220,225 Q 190,225 180,220 Z" fill="#d4b88a" stroke="#8b6f47" stroke-width="3" stroke-linejoin="round"/>

